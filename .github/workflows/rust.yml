name: rust

# Rust crates (crates/forge-scaffold, crates/forge): format, lint, build,
# test, and the end-to-end checks. Both crates have no external
# dependencies (forge-scaffold is std-only; forge depends on it by path),
# so the build needs no registry cache and stays offline-friendly.
#
# Toolchain is pinned to 1.85, the crates' MSRV (edition 2024). If the code
# uses a newer feature, this job fails first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [forge-scaffold, forge]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test (unit + e2e acceptance)
        run: cargo test --locked

  scaffold-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Build the scaffold binary (release)
        run: cargo build --release --locked
        working-directory: crates/forge-scaffold

      - name: Scaffold into an empty folder
        run: |
          ./crates/forge-scaffold/target/release/forge-scaffold \
            --source "$GITHUB_WORKSPACE" --name ci-proof /tmp/forge-scaffold-proof

      - name: Verify the scaffolded repo
        run: |
          set -euo pipefail
          OUT=/tmp/forge-scaffold-proof
          test "$(ls "$OUT/skills" | wc -l)" -eq 32
          test "$(ls "$OUT/agents" | wc -l)" -eq 17
          test "$(ls "$OUT/commands"/*.md | wc -l)" -eq 29
          test "$(ls "$OUT/commands"/*.toml | wc -l)" -eq 29
          test -f "$OUT/commands/rendered.json"
          test "$(ls "$OUT/.opencode/commands"/*.md | wc -l)" -eq 29
          test "$(ls "$OUT/.cursor/commands"/*.md | wc -l)" -eq 29
          test -f "$OUT/.github/extensions/forge-anything/extension.mjs"
          # Curated agents in every harness's native form.
          test "$(ls "$OUT/.claude/agents"/*.md | wc -l)" -eq 17
          test "$(ls "$OUT/.cursor/agents"/*.md | wc -l)" -eq 17
          test "$(ls "$OUT/.opencode/agents"/*.md | wc -l)" -eq 17
          test "$(ls "$OUT/.codex/agents"/*.toml | wc -l)" -eq 17
          test "$(ls "$OUT/.pi/agents"/*.md | wc -l)" -eq 17
          test "$(ls "$OUT/.omp/agents"/*.md | wc -l)" -eq 17
          test "$(ls "$OUT/.github/agents"/*.agent.md | wc -l)" -eq 17
          test "$(ls "$OUT/.agents/agents"/*.md | wc -l)" -eq 17
          # Project MCP configs for every harness that reads them.
          test -f "$OUT/.mcp.json"
          test -f "$OUT/mcp.json"
          test -f "$OUT/.cursor/mcp.json"
          test -f "$OUT/.codex/config.toml"
          test -f "$OUT/.opencode/opencode.json"
          # Codex SessionStart hook: the hook file plus the script it calls.
          test -f "$OUT/.codex/hooks.json"
          test -f "$OUT/hooks/session-start"
          test -f "$OUT/README.md"
          test -f "$OUT/AGENTS.md"
          test -f "$OUT/WORKFLOW.md"
          test -f "$OUT/skills.json"
          test -f "$OUT/skills/using-forge-anything/SKILL.md"
          test -f "$OUT/agents/forge-ceo/SOUL.md"
          # No plugin manifests in the scaffolded repo (commands and agents
          # ship per harness; the manifests stay in the Forge Anything
          # repo). The project MCP configs above are not plugin manifests:
          # they are the project's own server configs.
          test ! -e "$OUT/.claude-plugin"
          test -f "$OUT/docs/departments/Executive/README.md"
          test -f "$OUT/docs/departments/Knowledge/README.md"
          # No old product name anywhere in the scaffolded repo.
          if grep -rio "galyarder framework\|galyarder-framework" "$OUT" | head -1 | grep -q .; then
            echo "scaffolded repo still names the old product" >&2
            exit 1
          fi
          echo "scaffold e2e: OK ($(find "$OUT" -type f | wc -l) files)"

  forge-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Build the forge CLI (release)
        run: cargo build --release --locked
        working-directory: crates/forge

      - name: Help lists the commands; version matches package.json
        run: |
          set -euo pipefail
          FORGE=./crates/forge/target/release/forge
          "$FORGE" --help | grep -q "Forge Anything CLI"
          for cmd in scaffold smoke version help; do
            "$FORGE" --help | grep -q "  $cmd"
          done
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          test "$("$FORGE" --version)" = "Forge Anything v$PKG_VERSION"
          echo "forge help/version: OK"

      - name: Scaffold through the forge CLI
        run: |
          set -euo pipefail
          ./crates/forge/target/release/forge scaffold --name ci-proof /tmp/forge-cli-proof
          test "$(ls /tmp/forge-cli-proof/skills | wc -l)" -eq 32
          test "$(ls /tmp/forge-cli-proof/agents | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/commands/*.md | wc -l)" -eq 29
          test "$(ls /tmp/forge-cli-proof/commands/*.toml | wc -l)" -eq 29
          test -f /tmp/forge-cli-proof/commands/rendered.json
          test "$(ls /tmp/forge-cli-proof/.opencode/commands/*.md | wc -l)" -eq 29
          test "$(ls /tmp/forge-cli-proof/.cursor/commands/*.md | wc -l)" -eq 29
          test -f /tmp/forge-cli-proof/.github/extensions/forge-anything/extension.mjs
          # Curated agents in every harness's native form.
          test "$(ls /tmp/forge-cli-proof/.claude/agents/*.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.cursor/agents/*.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.opencode/agents/*.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.codex/agents/*.toml | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.pi/agents/*.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.omp/agents/*.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.github/agents/*.agent.md | wc -l)" -eq 17
          test "$(ls /tmp/forge-cli-proof/.agents/agents/*.md | wc -l)" -eq 17
          # Project MCP configs for every harness that reads them.
          test -f /tmp/forge-cli-proof/.mcp.json
          test -f /tmp/forge-cli-proof/mcp.json
          test -f /tmp/forge-cli-proof/.cursor/mcp.json
          test -f /tmp/forge-cli-proof/.codex/config.toml
          test -f /tmp/forge-cli-proof/.opencode/opencode.json
          # Codex SessionStart hook: the hook file plus the script it calls.
          test -f /tmp/forge-cli-proof/.codex/hooks.json
          test -f /tmp/forge-cli-proof/hooks/session-start
          test -f /tmp/forge-cli-proof/README.md
          echo "forge scaffold: OK"

      - name: Smoke through the forge CLI
        run: |
          ./crates/forge/target/release/forge smoke | tee /tmp/forge-smoke.txt
          grep -q "SMOKE TEST PASSED" /tmp/forge-smoke.txt
